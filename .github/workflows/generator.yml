name: Generate AI RSS Feed

on:
  schedule:
    # GitHub opóźnia harmonogramy nawet o kilka godzin, więc zamiast jednej
    # próby robimy cztery w ciągu nocy (23:15, 0:45, 2:15, 3:45 UTC = 1:15,
    # 2:45, 4:15, 5:45 czasu polskiego latem). Pierwsza, która realnie
    # wystartuje, buduje zestaw; pozostałe wychodzą na blokadzie w index.js,
    # zanim wydadzą jeden token. Minuty przed pełną godziną — kolejka jest
    # najdłuższa dokładnie o równych godzinach.
    - cron: '15 23 * * *'
    - cron: '45 0 * * *'
    - cron: '15 2 * * *'
    - cron: '45 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Próbny przebieg — nie zapisuje historii, nie publikuje feeda'
        type: boolean
        default: false
      limit:
        description: 'Ile artykułów zsyntezować (puste = wszystkie)'
        type: string
        default: ''
      force:
        description: 'Zbuduj zestaw nawet, jeśli dzisiejszy już istnieje'
        type: boolean
        default: false

# Gdyby dwie opóźnione próby dogoniły się nawzajem — druga czeka na pierwszą
# i wtedy widzi już zaktualizowane archive.json.
concurrency:
  group: generate-feed
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      # ffmpeg bywa preinstalowany na ubuntu-latest, ale to nie jest gwarancja
      # kontraktu — bez niego odsłuch zostaje 6× większym WAV-em.
      - name: Ensure ffmpeg
        run: ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Run generator
        id: run
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ -n "${{ inputs.limit }}" ]; then FLAGS="$FLAGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then FLAGS="$FLAGS --force"; fi
          echo "node src/index.js $FLAGS"
          node src/index.js $FLAGS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Publish audio to Releases
        if: inputs.dry_run != true && steps.run.outputs.audio_path != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.run.outputs.audio_tag }}"
          gh release create "$TAG" --title "$TAG" --notes "Odsłuch wydania" 2>/dev/null || true
          gh release upload "$TAG" "${{ steps.run.outputs.audio_path }}" "${{ steps.run.outputs.audio_script }}" --clobber
          # Retencja — releases starsze niż audio.retentionDays lecą razem z plikami.
          KEEP=$(node -p "require('./config.json').audio.retentionDays")
          CUTOFF=$(date -u -d "$KEEP days ago" +%Y-%m-%d)
          # grep bez trafień zwraca 1 i przy set -e wywaliłby cały krok.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | { grep '^audio-' || true; } \
            | while read -r t; do
                if [[ "${t#audio-}" < "$CUTOFF" ]]; then
                  gh release delete "$t" --yes --cleanup-tag || true
                fi
              done

      - name: Upload dry-run preview
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-preview
          path: |
            /tmp/preview.html
            /tmp/feed-dry.xml
          if-no-files-found: warn

      - name: Commit state
        if: inputs.dry_run != true && steps.run.outputs.skipped != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git stash pop
          git add history.json archive.json public/feed.xml
          git diff --staged --quiet || git commit -m "chore: update feed state"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Pages serwuje tylko to, co jest w publish_dir, a force_orphan kasuje
      # historię gałęzi. Nagrania z poprzednich dni trzeba więc odtworzyć
      # z Releases, które są trwałym magazynem.
      - name: Restore recent audio from Releases
        if: inputs.dry_run != true && steps.run.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public/audio
          KEEP=$(node -p "require('./config.json').audio.retentionDays")
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | { grep '^audio-' || true; } | head -n "$KEEP" \
            | while read -r t; do
                gh release download "$t" -D public/audio --clobber --pattern '*.mp3' --pattern '*.m4a' || true
              done
          ls -la public/audio | tail -n +2

      - name: Deploy feed to GitHub Pages
        if: inputs.dry_run != true && steps.run.outputs.skipped != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # Bez tego każde nagranie zostawałoby na zawsze w historii gh-pages.
          force_orphan: true
