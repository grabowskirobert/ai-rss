name: Generate AI RSS Feed

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Próbny przebieg — nie zapisuje historii, nie publikuje feeda'
        type: boolean
        default: false
      limit:
        description: 'Ile artykułów zsyntezować (puste = wszystkie)'
        type: string
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Sync with remote
        run: git fetch origin && git reset --hard origin/main

      - name: Run generator
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ -n "${{ inputs.limit }}" ]; then FLAGS="$FLAGS --limit ${{ inputs.limit }}"; fi
          echo "node src/index.js $FLAGS"
          node src/index.js $FLAGS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Show generated feed (dry run)
        if: inputs.dry_run == true
        run: cat /tmp/feed-dry.xml || echo "brak pliku — run zakończył się przed budowaniem feeda"

      - name: Commit state
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase origin main
          git stash pop
          git add history.json archive.json public/feed.xml
          git diff --staged --quiet || git commit -m "chore: update feed state"
          git push

      - name: Deploy feed to GitHub Pages
        if: inputs.dry_run != true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
