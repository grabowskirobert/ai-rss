<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Odsłuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3eee4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)">
<title>Odsłuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3eee4;
    --bg-glow: #fbf3e3;
    --card: #fffdf8;
    --ink: #1b1a17;
    --muted: #7a7366;
    --line: #e4dccd;
    --accent: #b4441f;
    --accent-soft: rgba(180, 68, 31, .14);
    --on-accent: #fffdf8;
    --bar: #d9cfbd;
    --shadow: 0 1px 2px rgba(60, 40, 10, .06), 0 12px 32px -12px rgba(60, 40, 10, .18);
    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14120f;
      --bg-glow: #221a12;
      --card: #1d1a16;
      --ink: #f4eee3;
      --muted: #9b9385;
      --line: #2f2a23;
      --accent: #f0875a;
      --accent-soft: rgba(240, 135, 90, .16);
      --on-accent: #1a1209;
      --bar: #3a342b;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px -16px rgba(0, 0, 0, .6);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body {
    margin: 0 auto; max-width: 30rem; min-height: 100vh;
    padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
    font-family: var(--sans); color: var(--ink);
    background: radial-gradient(120% 60% at 50% -10%, var(--bg-glow), transparent 70%) no-repeat;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible, [role=slider]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Nagłówek */
  .masthead { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 22px; }
  .brand { font-family: var(--serif); font-weight: 700; font-size: 1.15rem; letter-spacing: -.01em; }
  .brand small { font-family: var(--sans); font-weight: 500; font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-left: 6px; }
  .onair {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: .64rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted); padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px;
    transition: color .3s, border-color .3s, background .3s;
  }
  .onair i { width: 7px; height: 7px; border-radius: 50%; background: var(--bar); transition: background .3s; }
  body.playing .onair { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); }
  body.playing .onair i { background: var(--accent); animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  /* Karta odtwarzacza */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); }
  .player { padding: 24px 20px 22px; }
  .rise { animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; }
  .rise.d1 { animation-delay: .08s; } .rise.d2 { animation-delay: .16s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

  .kicker { font-size: .7rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
  .headline { font-family: var(--serif); font-weight: 500; font-size: 2.1rem; line-height: 1.05; letter-spacing: -.02em; margin: 0; }
  .sub { color: var(--muted); font-size: .85rem; margin: 8px 0 0; }
  .swap { animation: swap .45s ease both; }
  @keyframes swap { from { opacity: 0; transform: translateY(6px); } }

  /* Fala — jednocześnie pasek postępu i suwak */
  .wave {
    position: relative; height: 64px; margin: 26px 0 6px; touch-action: none; cursor: pointer;
    --p: 0%;
  }
  .wave .bars { position: absolute; inset: 0; display: flex; align-items: center; gap: 2px; }
  .wave .bars span { flex: 1; border-radius: 2px; background: var(--bar); transform-origin: center; }
  .wave .bars.fill { clip-path: inset(0 calc(100% - var(--p)) 0 0); }
  .wave .bars.fill span { background: var(--accent); }
  .wave.grow .bars span { animation: grow .7s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 8ms); }
  @keyframes grow { from { transform: scaleY(.05); } }
  .wave .head {
    position: absolute; top: 4px; bottom: 4px; left: var(--p); width: 2px; margin-left: -1px;
    background: var(--ink); border-radius: 1px; opacity: .85; pointer-events: none;
  }
  .wave .head::after {
    content: ''; position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; margin-left: -5px;
    border-radius: 50%; background: var(--ink);
  }
  .times { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Sterowanie */
  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin: 16px 0 22px; }
  .skip {
    justify-self: center; width: 58px; height: 58px; border-radius: 50%; position: relative;
    display: grid; place-items: center; transition: background .2s, transform .15s;
  }
  .skip:hover { background: var(--accent-soft); }
  .skip:active { transform: scale(.9); }
  .skip svg { width: 32px; height: 32px; transition: transform .35s cubic-bezier(.3, 1.5, .5, 1); }
  .skip.spin-l svg { transform: rotate(-40deg); } .skip.spin-r svg { transform: rotate(40deg); }
  .skip b { position: absolute; font-size: .6rem; font-weight: 600; top: 50%; left: 50%; transform: translate(-50%, -36%); }

  .play {
    position: relative; width: 84px; height: 84px; border-radius: 50%;
    background: var(--accent); color: var(--on-accent);
    box-shadow: 0 10px 24px -8px var(--accent), inset 0 1px 0 rgba(255, 255, 255, .25);
    transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), box-shadow .3s;
  }
  .play:active { transform: scale(.92); }
  .play::before, .play::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent);
    opacity: 0; pointer-events: none;
  }
  body.playing .play::before { animation: ripple 2.4s ease-out infinite; }
  body.playing .play::after { animation: ripple 2.4s ease-out 1.2s infinite; }
  @keyframes ripple { from { opacity: .45; transform: scale(1); } to { opacity: 0; transform: scale(1.6); } }
  /* Ikona: dwie połówki, które z trójkąta składają się w dwie belki pauzy */
  .icon { position: absolute; inset: 0; margin: auto; width: 30px; height: 32px; }
  .icon i {
    position: absolute; top: 0; height: 100%; width: 50%; background: currentColor;
    transition: clip-path .32s cubic-bezier(.6, 0, .2, 1), transform .32s cubic-bezier(.6, 0, .2, 1);
  }
  .icon i:first-child { left: 0; clip-path: polygon(0 0, 100% 25%, 100% 75%, 0 100%); transform: translateX(3px); }
  .icon i:last-child { right: 0; clip-path: polygon(0 25%, 100% 50%, 100% 50%, 0 75%); transform: translateX(2px); }
  body.playing .icon i:first-child { clip-path: polygon(0 0, 66% 0, 66% 100%, 0 100%); transform: translateX(1px); }
  body.playing .icon i:last-child { clip-path: polygon(34% 0, 100% 0, 100% 100%, 34% 100%); transform: translateX(-1px); }
  .play.loading .icon { opacity: 0; }
  .play .spinner {
    position: absolute; inset: 26px; border-radius: 50%; border: 3px solid currentColor; border-right-color: transparent;
    opacity: 0; animation: spin .8s linear infinite; transition: opacity .2s;
  }
  .play.loading .spinner { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Prędkość */
  .speed-label { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px; }
  .speed-label span { font-size: .68rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .speed-label output { font-family: var(--serif); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .speeds {
    position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr);
    background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 4px;
  }
  .speeds .pill {
    position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 10px;
    width: calc((100% - 8px) / var(--n)); transform: translateX(calc(100% * var(--k)));
    background: var(--card); box-shadow: 0 1px 3px rgba(0, 0, 0, .12);
    transition: transform .35s cubic-bezier(.3, 1.3, .5, 1);
  }
  .speeds button {
    position: relative; padding: 9px 0; font-size: .82rem; font-weight: 500; color: var(--muted);
    font-variant-numeric: tabular-nums; transition: color .2s;
  }
  .speeds button[aria-pressed=true] { color: var(--ink); font-weight: 600; }

  /* Tematy */
  .topics { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line); }
  .section-title { font-size: .68rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  .topics ol { list-style: none; margin: 0; padding: 0; counter-reset: t; }
  .topics li {
    counter-increment: t; display: grid; grid-template-columns: 28px 1fr; gap: 4px;
    font-size: .92rem; line-height: 1.45; margin-bottom: 10px;
    animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 60ms + .1s);
  }
  .topics li::before { content: counter(t, decimal-leading-zero); font-family: var(--serif); color: var(--accent); font-size: .85rem; padding-top: 1px; }

  /* Lista wydań */
  .archive { margin-top: 26px; }
  .archive .section-title { margin-left: 4px; }
  .archive ul { list-style: none; margin: 0; padding: 6px; }
  .archive li + li { border-top: 1px solid var(--line); }
  .ep {
    width: 100%; display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 10px;
    text-align: left; padding: 13px 10px; border-radius: 12px; transition: background .2s;
  }
  .ep:hover { background: var(--accent-soft); }
  .ep .name { font-size: .95rem; }
  .ep .name::first-letter { text-transform: uppercase; }
  .ep .meta { font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ep .mark { width: 22px; height: 22px; display: grid; place-items: center; color: var(--muted); }
  .ep .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .ep .ring { width: 18px; height: 18px; }
  .ep[aria-current=true] .name { color: var(--accent); font-weight: 600; }
  .eq { display: flex; gap: 2px; align-items: flex-end; height: 14px; }
  .eq i { width: 3px; height: 100%; background: var(--accent); border-radius: 1px; transform-origin: bottom; transform: scaleY(.3); }
  body.playing .eq i { animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.4s !important; } .eq i:nth-child(3) { animation-delay: -.7s !important; }
  @keyframes eq { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }

  .status { text-align: center; color: var(--muted); padding: 60px 0; }
  .status .eq { justify-content: center; height: 22px; margin-bottom: 14px; }
  .status .eq i { width: 4px; animation: eq 1s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header class="masthead">
  <div class="brand">Odsłuch<small>AI RSS</small></div>
  <div class="onair"><i></i>Na antenie</div>
</header>

<div class="status" id="status">
  <div class="eq"><i></i><i></i><i></i></div>
  <span id="status-text">Stroję odbiornik…</span>
</div>

<section class="card player rise" id="player" hidden>
  <div id="head">
    <p class="kicker" id="kicker"></p>
    <h1 class="headline" id="headline"></h1>
    <p class="sub" id="sub"></p>
  </div>

  <div class="wave" id="wave" role="slider" tabindex="0" aria-label="Pozycja w nagraniu" aria-valuemin="0">
    <div class="bars" id="bars"></div>
    <div class="bars fill" id="bars-fill"></div>
    <div class="head"></div>
  </div>
  <div class="times"><span id="cur">0:00</span><span id="left">−0:00</span></div>

  <div class="controls">
    <button class="skip" id="back" aria-label="Cofnij 15 sekund">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
      <b>15</b>
    </button>
    <button class="play" id="play" aria-label="Odtwórz">
      <span class="icon"><i></i><i></i></span>
      <span class="spinner"></span>
    </button>
    <button class="skip" id="fwd" aria-label="Przewiń 30 sekund">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4.5h-4.5"/></svg>
      <b>30</b>
    </button>
  </div>

  <div class="speed-label"><span>Prędkość</span><output id="speed-out"></output></div>
  <div class="speeds" id="speeds"><div class="pill"></div></div>

  <div class="topics" id="topics" hidden>
    <p class="section-title">W tym wydaniu</p>
    <ol id="topic-list"></ol>
  </div>
</section>

<section class="archive rise d2" id="archive" hidden>
  <p class="section-title">Wydania</p>
  <div class="card"><ul id="episodes"></ul></div>
</section>

<audio id="audio" preload="metadata"></audio>

<script>
// Strona czyta feed.xml z tego samego Pages, więc nie wymaga żadnych zmian
// w generatorze — każde nowe wydanie z enclosure pojawia się samo.
const FEED_URL = 'feed.xml';
// Nagrania żyją na Pages tyle, ile audio.retentionDays w config.json;
// starszych wpisów nie pokazujemy, bo ich MP3 już nie ma.
const RETENTION_DAYS = 14;
const SPEEDS = [1, 1.15, 1.25, 1.5, 1.75, 2];
const BACK_SEC = 15;
const FWD_SEC = 30;
const BAR_COUNT = 56;

const $ = (id) => document.getElementById(id);
const audio = $('audio');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let episodes = [];
let current = null;
let speed = store.get('speed', 1.15);
if (!SPEEDS.includes(speed)) speed = 1.15;
let dragging = false;
let dragPos = 0;

function fmt(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? `${h}:${String(m).padStart(2, '0')}` : `${m}`) + `:${String(s).padStart(2, '0')}`;
}
const fmtSpeed = (s) => `${String(s).replace('.', ',')}×`;

function parseFeed(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const cutoff = Date.now() - RETENTION_DAYS * 864e5;
  return [...doc.querySelectorAll('item')].flatMap((item) => {
    const enc = item.querySelector('enclosure');
    if (!enc || !(enc.getAttribute('type') || '').startsWith('audio/')) return [];
    const date = new Date(item.querySelector('pubDate')?.textContent || 0);
    if (date.getTime() < cutoff) return [];
    const rawTitle = item.querySelector('title')?.textContent || '';
    const duration = (rawTitle.match(/\((\d+:\d{2}(?::\d{2})?)\)\s*$/) || [])[1] || '';
    const encoded = item.getElementsByTagNameNS('http://purl.org/rss/1.0/modules/content/', 'encoded')[0];
    const body = new DOMParser().parseFromString(encoded?.textContent || '', 'text/html');
    const topics = [...body.querySelectorAll('ul li')].map((li) => li.textContent.trim()).filter(Boolean);
    return [{
      id: item.querySelector('guid')?.textContent || enc.getAttribute('url'),
      url: enc.getAttribute('url'),
      date, duration, topics,
    }];
  }).sort((a, b) => b.date - a.date);
}

const weekday = (d) => d.toLocaleDateString('pl-PL', { weekday: 'long' });
const dayMonth = (d) => d.toLocaleDateString('pl-PL', { day: 'numeric', month: 'long' });
function relDay(d) {
  const days = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(d).setHours(0, 0, 0, 0)) / 864e5);
  return days === 0 ? 'Dzisiejsze wydanie' : days === 1 ? 'Wczorajsze wydanie' : `Wydanie sprzed ${days} dni`;
}

// Fala nie jest prawdziwą obwiednią nagrania (to wymagałoby dekodowania MP3
// z innego originu) — to deterministyczny wzór z id wydania, żeby każde
// wyglądało inaczej, ale zawsze tak samo.
function waveShape(seed) {
  let h = 2166136261;
  for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  const rnd = () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296;
  const raw = Array.from({ length: BAR_COUNT }, rnd);
  return raw.map((_, i) => {
    const avg = (raw[i - 1] ?? raw[i]) * .25 + raw[i] * .5 + (raw[i + 1] ?? raw[i]) * .25;
    const edge = Math.min(1, Math.min(i, BAR_COUNT - 1 - i) / 4 + .35);
    return Math.max(.12, Math.min(1, (.25 + avg * .85) * edge));
  });
}

function renderWave(ep) {
  const shape = waveShape(ep.id);
  for (const id of ['bars', 'bars-fill']) {
    const box = $(id);
    box.innerHTML = '';
    shape.forEach((v, i) => {
      const s = document.createElement('span');
      s.style.height = `${v * 100}%`;
      s.style.setProperty('--i', i);
      box.append(s);
    });
  }
  const wave = $('wave');
  wave.classList.remove('grow'); void wave.offsetWidth; wave.classList.add('grow');
}

function renderSpeeds() {
  const box = $('speeds');
  box.style.setProperty('--n', SPEEDS.length);
  box.querySelectorAll('button').forEach((b) => b.remove());
  for (const s of SPEEDS) {
    const b = document.createElement('button');
    b.textContent = String(s).replace('.', ',');
    b.setAttribute('aria-label', `Prędkość ${fmtSpeed(s)}`);
    b.onclick = () => setSpeed(s);
    box.append(b);
  }
  markSpeed();
}

function markSpeed() {
  const k = SPEEDS.indexOf(speed);
  $('speeds').style.setProperty('--k', k);
  $('speeds').querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', String(i === k)));
  $('speed-out').textContent = fmtSpeed(speed);
}

function setSpeed(s) {
  speed = s;
  store.set('speed', s);
  audio.playbackRate = s;
  audio.defaultPlaybackRate = s;
  markSpeed();
  updateTime();
}

function ringIcon(frac) {
  const r = 7, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 18 18"><circle cx="9" cy="9" r="${r}" fill="none" stroke="var(--line)" stroke-width="2.2"/>` +
    `<circle cx="9" cy="9" r="${r}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" ` +
    `stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - frac)}" transform="rotate(-90 9 9)"/></svg>`;
}

function durSec(ep) {
  const p = ep.duration.split(':').map(Number);
  return p.reduce((a, v) => a * 60 + v, 0) || 0;
}

function renderList() {
  const ul = $('episodes');
  ul.innerHTML = '';
  for (const ep of episodes) {
    const pos = store.get(`pos:${ep.id}`, 0);
    const done = store.get(`done:${ep.id}`, false);
    const total = durSec(ep);
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'ep';
    b.setAttribute('aria-current', String(ep === current));

    const mark = document.createElement('span');
    mark.className = 'mark';
    if (ep === current) mark.innerHTML = '<span class="eq"><i></i><i></i><i></i></span>';
    else if (done) mark.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
    else if (pos > 5 && total) mark.innerHTML = ringIcon(Math.min(1, pos / total));
    else mark.innerHTML = '<span class="dot"></span>';

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = `${weekday(ep.date)}, ${dayMonth(ep.date)}`;
    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = done ? 'odsłuchane' : pos > 5 ? `zostało ${fmt(total - pos)}` : ep.duration;

    b.append(mark, name, meta);
    b.onclick = () => { load(ep); play(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    li.append(b);
    ul.append(li);
  }
}

function load(ep) {
  if (current === ep) return;
  current = ep;
  store.set('last', ep.id);
  audio.src = ep.url;
  audio.playbackRate = speed;
  audio.defaultPlaybackRate = speed;
  const saved = store.get(`pos:${ep.id}`, 0);
  audio.addEventListener('loadedmetadata', () => {
    if (saved > 5 && saved < audio.duration - 10) audio.currentTime = saved;
    audio.playbackRate = speed;
    updateTime();
  }, { once: true });

  const head = $('head');
  $('kicker').textContent = relDay(ep.date);
  $('headline').textContent = dayMonth(ep.date);
  $('sub').textContent = [weekday(ep.date), ep.duration && `${ep.duration} min`, ep.topics.length && `${ep.topics.length} tematów`]
    .filter(Boolean).join(' · ');
  head.classList.remove('swap'); void head.offsetWidth; head.classList.add('swap');

  const tl = $('topic-list');
  tl.innerHTML = '';
  ep.topics.forEach((t, i) => { const li = document.createElement('li'); li.textContent = t; li.style.setProperty('--i', i); tl.append(li); });
  $('topics').hidden = ep.topics.length === 0;

  renderWave(ep);
  updateTime();

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: `Odsłuch — ${dayMonth(ep.date)}`,
      artist: 'AI RSS',
      album: ep.topics[0] || weekday(ep.date),
    });
  }
  renderList();
}

function play() { audio.play().catch(() => {}); }
function toggle() { audio.paused ? play() : audio.pause(); }
function skip(d) {
  if (!audio.duration) return;
  audio.currentTime = Math.max(0, Math.min(audio.duration - 1, audio.currentTime + d));
  updateTime();
  const btn = $(d < 0 ? 'back' : 'fwd'), cls = d < 0 ? 'spin-l' : 'spin-r';
  btn.classList.add(cls); setTimeout(() => btn.classList.remove(cls), 220);
}

function updateTime() {
  const d = audio.duration || durSec(current || { duration: '' }) || 0;
  const t = dragging ? dragPos : (audio.currentTime || 0);
  const pct = d ? Math.min(100, (t / d) * 100) : 0;
  const wave = $('wave');
  wave.style.setProperty('--p', `${pct}%`);
  wave.setAttribute('aria-valuemax', String(Math.floor(d)));
  wave.setAttribute('aria-valuenow', String(Math.floor(t)));
  wave.setAttribute('aria-valuetext', `${fmt(t)} z ${fmt(d)}`);
  $('cur').textContent = fmt(t);
  // Pozostały czas po uwzględnieniu prędkości — tyle realnie zostało słuchania.
  $('left').textContent = '−' + fmt((d - t) / (audio.playbackRate || speed || 1));
  if ('mediaSession' in navigator && audio.duration && navigator.mediaSession.setPositionState) {
    try { navigator.mediaSession.setPositionState({ duration: audio.duration, position: Math.min(audio.currentTime, audio.duration), playbackRate: audio.playbackRate || 1 }); } catch {}
  }
}

let lastSave = 0;
function savePos(force) {
  if (!current || !audio.duration) return;
  const now = Date.now();
  if (!force && now - lastSave < 4000) return;
  lastSave = now;
  store.set(`pos:${current.id}`, audio.currentTime);
}

audio.addEventListener('timeupdate', () => { updateTime(); savePos(false); });
audio.addEventListener('durationchange', updateTime);
audio.addEventListener('ratechange', updateTime);
audio.addEventListener('waiting', () => $('play').classList.add('loading'));
audio.addEventListener('playing', () => $('play').classList.remove('loading'));
audio.addEventListener('play', () => {
  // Safari potrafi zresetować prędkość przy starcie po zmianie src.
  if (audio.playbackRate !== speed) audio.playbackRate = speed;
  document.body.classList.add('playing');
  $('play').setAttribute('aria-label', 'Pauza');
});
audio.addEventListener('pause', () => {
  document.body.classList.remove('playing');
  $('play').classList.remove('loading');
  $('play').setAttribute('aria-label', 'Odtwórz');
  savePos(true);
  renderList();
});
audio.addEventListener('ended', () => {
  if (!current) return;
  store.set(`done:${current.id}`, true);
  store.set(`pos:${current.id}`, 0);
  renderList();
});
audio.addEventListener('error', () => {
  if (current) $('sub').textContent = 'Nie udało się wczytać nagrania';
  $('play').classList.remove('loading');
});

// Przeciąganie po fali
const wave = $('wave');
function posFromEvent(e) {
  const r = wave.getBoundingClientRect();
  const d = audio.duration || durSec(current) || 0;
  return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * d;
}
wave.addEventListener('pointerdown', (e) => {
  dragging = true; dragPos = posFromEvent(e);
  wave.setPointerCapture(e.pointerId);
  updateTime();
});
wave.addEventListener('pointermove', (e) => { if (dragging) { dragPos = posFromEvent(e); updateTime(); } });
const endDrag = () => {
  if (!dragging) return;
  dragging = false;
  if (audio.duration) audio.currentTime = dragPos;
  savePos(true); updateTime();
};
wave.addEventListener('pointerup', endDrag);
wave.addEventListener('pointercancel', endDrag);
wave.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') { e.preventDefault(); skip(-BACK_SEC); }
  if (e.key === 'ArrowRight') { e.preventDefault(); skip(FWD_SEC); }
});

$('play').onclick = toggle;
$('back').onclick = () => skip(-BACK_SEC);
$('fwd').onclick = () => skip(FWD_SEC);

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target.tagName !== 'BUTTON') { e.preventDefault(); toggle(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) savePos(true); });

if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession;
  const h = (a, f) => { try { ms.setActionHandler(a, f); } catch {} };
  h('play', play);
  h('pause', () => audio.pause());
  h('seekbackward', (d) => skip(-(d.seekOffset || BACK_SEC)));
  h('seekforward', (d) => skip(d.seekOffset || FWD_SEC));
  h('seekto', (d) => { audio.currentTime = d.seekTime; updateTime(); });
}

(async () => {
  try {
    const res = await fetch(FEED_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    episodes = parseFeed(await res.text());
  } catch {
    $('status-text').textContent = 'Nie udało się pobrać feedu.';
    return;
  }
  if (!episodes.length) { $('status-text').textContent = 'Brak nagrań z ostatnich dni.'; return; }
  $('status').hidden = true;
  $('player').hidden = false;
  $('archive').hidden = episodes.length < 2;
  renderSpeeds();
  const lastId = store.get('last', null);
  const last = episodes.find((e) => e.id === lastId);
  // Najnowsze wydanie, chyba że poprzednie jest w trakcie słuchania.
  const resume = last && !store.get(`done:${last.id}`, false) && store.get(`pos:${last.id}`, 0) > 5;
  load(resume ? last : episodes[0]);
})();
</script>
</body>
</html>
